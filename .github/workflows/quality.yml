name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install UQRA and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check packages tests benchmarks
      - name: Check formatting
        run: ruff format --check packages tests benchmarks
      - name: Test
        run: python -m pytest -q
      - name: Run mathematical benchmarks
        run: |
          python benchmarks/mathematical/backend_interface/run.py
          python benchmarks/mathematical/core_probability/run.py
          python benchmarks/mathematical/ishigami/run.py
          python benchmarks/mathematical/reliability_engine/run.py

  openturns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional OpenTURNS backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,openturns]"
      - name: Test OpenTURNS adapter
        env:
          UQRA_TEST_OPENTURNS: "1"
        run: python -m pytest -q -m openturns
      - name: Run OpenTURNS benchmark
        run: python benchmarks/mathematical/openturns_backend/run.py

  uqpy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional UQpy backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,uqpy]"
      - name: Test UQpy adapter
        env:
          UQRA_TEST_UQPY: "1"
        run: python -m pytest -q -m uqpy
      - name: Run UQpy benchmark
        run: python benchmarks/mathematical/uqpy_backend/run.py

  chaospy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional Chaospy backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,chaospy]"
      - name: Test Chaospy adapter
        env:
          UQRA_TEST_CHAOSPY: "1"
        run: python -m pytest -q -m chaospy
      - name: Run Chaospy benchmark
        run: python benchmarks/mathematical/chaospy_backend/run.py

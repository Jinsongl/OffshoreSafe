schema_version: "1.0"
project:
  project_id: workflow-benchmark
  name: Engineering workflow benchmark
turbine:
  turbine_id: reference-15mw
  model: Reference 15 MW
  rated_power_mw: 15.0
  definition_file: turbine.yaml
solver:
  solver_id: openfast-benchmark
  adapter: openfast
  input_file: ../../openfast_adapter/input/main.fst
  output_file: loads.out
analyses:
  - analysis_id: statistics
    analysis_type: statistics
    method: descriptive
    settings:
      channels: [tower_base_fore_aft_moment]
  - analysis_id: extreme
    analysis_type: extreme
    method: gumbel
    settings:
      channel: tower_base_fore_aft_moment
      return_period: 50.0
      events_per_period: 12.0
  - analysis_id: fatigue
    analysis_type: fatigue
    method: rainflow-miner-del
    settings:
      channel: tower_base_fore_aft_moment
      slope: 3.0
      log10_intercept: 15.0
      equivalent_cycles: 100.0

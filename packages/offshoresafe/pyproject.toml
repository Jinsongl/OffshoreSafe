[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "offshoresafe"
dynamic = ["version"]
description = "Probabilistic design and assessment platform for offshore energy systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uqra>=0.1.0a1",
    "scipy>=1.11",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "offshoresafe.__version__" }

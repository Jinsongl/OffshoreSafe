[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uqra"
dynamic = ["version"]
description = "General uncertainty quantification and reliability analysis framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OffshoreSafe contributors" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
openturns = ["openturns>=1.25"]
uqpy = ["UQpy>=4.2,<4.3", "setuptools<81"]
chaospy = [
    "chaospy>=4.3.21,<4.4",
    "numpoly>=1.3.9,<1.4",
    "numpy>=2.0,<2.3",
]

[tool.setuptools]
package-dir = { "" = "packages/uqra/src" }

[tool.setuptools.packages.find]
where = ["packages/uqra/src"]

[tool.setuptools.dynamic]
version = { attr = "uqra.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "openturns: requires the optional OpenTURNS backend",
    "uqpy: requires the optional UQpy backend",
    "chaospy: requires the optional Chaospy backend",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM", "UP", "RUF"]
